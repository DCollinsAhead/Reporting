<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Foundry Project Tracking Report</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero">
    <div>
      <h1>Foundry Project Tracking Report</h1>
      <p>Recreated from Power BI - live Jira data, running locally on this machine</p>
    </div>
    <div class="hero-controls">
      <span id="last-updated">Last updated -</span>
      <button id="refresh-btn" class="refresh" type="button">Refresh now</button>
    </div>
  </header>

  <nav class="page-tabs" id="page-tabs"></nav>

  <main id="page-panels"></main>

  <footer>Auto-refreshes every 5 minutes - queries Jira directly from this machine, nothing sent anywhere else.</footer>

  <div id="tooltip" class="tooltip"></div>

  <script src="dashboard.js"></script>
</body>
</html>
